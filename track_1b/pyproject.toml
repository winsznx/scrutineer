[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scrutineer"
version = "1.0.0"
description = "Multilingual recall benchmark for Swiss federal vote outcomes, built for Apertus 1.5."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Tim (winsznx)" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
replay = ["torch>=2.4", "transformers>=4.56", "accelerate>=0.34"]
contamination = ["datasets>=3.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
scrutineer = "scrutineer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["scrutineer"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "transformers.*", "torch.*", "datasets.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The judge prompt is a versioned artefact; wrapping its lines would change the prompt.
"src/scrutineer/grade/judge.py" = ["E501"]
